[project]
name = "qwen3-voice-service"
version = "0.1.0"
description = "Local voice processing center with OpenAI-compatible API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "ffmpeg-python>=0.2.0",
    "soundfile>=0.13.0",
    "modelscope>=1.0.0",
]

[project.optional-dependencies]
mlx = ["mlx-audio>=0.3", "mlx-lm>=0.25"]
cuda = ["torch>=2.4", "transformers>=4.48"]
dev = ["pytest>=8.3.0", "httpx>=0.28.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
